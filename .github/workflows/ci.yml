name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version consistency check
        run: |
          PKG=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          CARGO=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/version = "//;s/"//')
          TAURI=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "package.json : $PKG"
          echo "Cargo.toml   : $CARGO"
          echo "tauri.conf   : $TAURI"
          if [ "$PKG" != "$CARGO" ] || [ "$PKG" != "$TAURI" ]; then
            echo "❌ Version mismatch — all three files must agree."
            exit 1
          fi
          echo "✓ All versions agree: $PKG"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Byte-compile verification
        run: |
          python -m py_compile cleo_server.py cleo_agent.py cleo_logger.py cleo_memory.py cleo_finops_refs.py

      - name: Run test suites
        run: |
          python test_streaming.py
          python test_area_chart_integration.py
          if [ -f test_pure_functions.py ]; then python test_pure_functions.py; fi


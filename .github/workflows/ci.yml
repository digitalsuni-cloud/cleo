name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Byte-compile verification
        run: |
          python -m py_compile cleo_server.py cleo_agent.py cleo_logger.py cleo_memory.py cleo_finops_refs.py

      - name: Run test suites
        run: |
          python test_streaming.py
          python test_area_chart_integration.py
          if [ -f test_pure_functions.py ]; then python test_pure_functions.py; fi

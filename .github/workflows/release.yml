name: Release

# Triggered by a signed version tag: git tag -s v1.0.1 -m "Cleo v1.0.1" && git push origin v1.0.1
# Release workflow (CHConfig / Tauri multi-platform standard):
#   1. Builds native desktop binaries across macOS (ARM64), Linux (x86_64), and Windows (x86_64)
#   2. Builds the Python PyInstaller backend sidecar for each platform
#   3. Packages Tauri DMG, AppImage, DEB, and NSIS installer
#   4. Uploads all platform assets to the GitHub Release
#   5. Extracts and updates the GitHub Release notes from CHANGELOG.md

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  # ── Matrix Desktop Build (macOS, Linux, Windows) ───────────────────────────
  build-tauri:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_target: x86_64-unknown-linux-gnu
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # ── Linux System Dependencies for WebKit / Tauri ──────────────────────
      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # ── Python & PyInstaller Sidecar ───────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python Sidecar Binary
        shell: bash
        run: bash build-backend.sh --force

      # ── Rust Toolchain ─────────────────────────────────────────────────────
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust_target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.platform.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.platform.os }}-cargo-

      # ── Node & Tauri CLI ───────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri Desktop Package
        run: npx @tauri-apps/cli build --target ${{ matrix.platform.target }}

      # ── Collect Platform Artifacts ─────────────────────────────────────────
      - name: Collect & Stage Artifacts
        id: stage
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p dist_release
          if [ "${{ runner.os }}" = "macOS" ]; then
            shopt -s nullglob
            for f in src-tauri/target/${{ matrix.platform.target }}/release/bundle/dmg/*.dmg; do
              cp -f "$f" "dist_release/Cleo_${VERSION}_arm64.dmg"
            done
          elif [ "${{ runner.os }}" = "Linux" ]; then
            shopt -s nullglob
            for f in src-tauri/target/release/bundle/appimage/*.AppImage; do
              cp -f "$f" "dist_release/Cleo_${VERSION}_amd64.AppImage"
            done
            for f in src-tauri/target/release/bundle/deb/*.deb; do
              cp -f "$f" "dist_release/Cleo_${VERSION}_amd64.deb"
            done
          elif [ "${{ runner.os }}" = "Windows" ]; then
            shopt -s nullglob
            for f in src-tauri/target/release/bundle/nsis/*.exe; do
              cp -f "$f" "dist_release/Cleo_${VERSION}_x64-setup.exe"
            done
            for f in src-tauri/target/release/bundle/msi/*.msi; do
              cp -f "$f" "dist_release/Cleo_${VERSION}_x64.msi"
            done
          fi
          echo "Staged release artifacts:"
          ls -lh dist_release/

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist_release/*
          fail_on_unmatched_files: false

  # ── Update Release Notes with Checksums & Changelog ────────────────────────
  update-release-notes:
    name: Update Release Notes
    needs: [build-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Release Notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            python3 -c "
          import re
          with open('CHANGELOG.md') as f:
              content = f.read()
          # Match ## vX.Y.Z ... up to the next ## v or end of file
          m = re.search(r'(## v' + re.escape('${VERSION}') + r'[^\n]*\n)(.*?)(?=\n## v|\Z)', content, re.DOTALL)
          if m:
              with open('release_notes.md', 'w') as out:
                  out.write(m.group(0).strip())
          else:
              with open('release_notes.md', 'w') as out:
                  out.write('## Cleo ' + '${GITHUB_REF_NAME}' + '\n\nRelease ' + '${GITHUB_REF_NAME}' + ' is ready.')
          "
          else
            echo "## Cleo ${GITHUB_REF_NAME}" > release_notes.md
          fi
          cat release_notes.md

      - name: Update GitHub Release Body
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md

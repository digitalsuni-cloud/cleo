name: 'Tauri Build'

# CHConfig / Tauri multi-platform build workflow:
#   1. macOS is built locally via ./build-release.sh and uploaded via gh release upload
#   2. GitHub Actions builds:
#      - Linux x86_64 (AppImage & DEB)
#      - Windows x86_64 (Universal / Portable .exe — no MSI)
#   3. Uploads Linux and Windows platform assets to the GitHub Release
#   4. Consolidates SHA-256 checksums across all assets (macOS DMG from release + Linux + Windows)
#   5. Updates GitHub Release notes with the CHConfig download table, platform badges, and verification guide

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # ── Matrix Desktop Build (Linux x86_64 & Windows x86_64) ───────────────────
  build-tauri:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_target: x86_64-unknown-linux-gnu
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref }}

      - name: Resolve Release Tag & Version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Cleo ${VERSION} for tag ${TAG}"

      # ── Linux System Dependencies for WebKit / Tauri ──────────────────────
      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # ── Python & PyInstaller Sidecar ───────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python Sidecar Binary
        shell: bash
        run: bash build-backend.sh --force

      # ── Rust Toolchain ─────────────────────────────────────────────────────
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust_target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.platform.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.platform.os }}-cargo-

      # ── Node & Tauri CLI ───────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri Desktop Package
        run: npx @tauri-apps/cli build --target ${{ matrix.platform.target }}

      # ── Collect Platform Artifacts ─────────────────────────────────────────
      - name: Collect & Stage Artifacts
        id: stage
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p dist_release

          if [ "${{ runner.os }}" = "Linux" ]; then
            find src-tauri/target -type f -name "*.AppImage" -exec cp -f {} "dist_release/Cleo_${VERSION}_amd64.AppImage" \;
            find src-tauri/target -type f -name "*.deb" -exec cp -f {} "dist_release/Cleo_${VERSION}_amd64.deb" \;
          elif [ "${{ runner.os }}" = "Windows" ]; then
            EXE_FILE=$(find src-tauri/target -type f -path "*/bundle/nsis/*.exe" | head -n 1)
            if [ -z "$EXE_FILE" ]; then
              EXE_FILE=$(find src-tauri/target -type f -name "cleo.exe" ! -path "*/build/*" | head -n 1)
            fi
            if [ -n "$EXE_FILE" ]; then
              cp -f "$EXE_FILE" "dist_release/Cleo_${VERSION}_x64.exe"
            fi
          fi

          echo "Staged release artifacts:"
          ls -lh dist_release/
          if [ -z "$(ls -A dist_release)" ]; then
            echo "::error::No release artifacts found to stage!"
            exit 1
          fi

      # ── Compute Checksums ──────────────────────────────────────────────────
      - name: Compute SHA-256 Checksums
        shell: bash
        run: |
          mkdir -p checksum_artifact
          TARGET="${{ matrix.platform.target }}"
          python3 -c "
          import hashlib, os, sys
          target = sys.argv[1]
          with open(f'checksum_artifact/checksums-{target}.txt', 'w') as out:
              for fname in sorted(os.listdir('dist_release')):
                  fpath = os.path.join('dist_release', fname)
                  if os.path.isfile(fpath):
                      with open(fpath, 'rb') as f:
                          h = hashlib.sha256(f.read()).hexdigest()
                      out.write(f'{h}  {fname}\n')
                      print(f'{h}  {fname}')
          " "$TARGET"

      - name: Upload Platform Checksum Artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.platform.target }}
          path: checksum_artifact/checksums-*.txt

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          files: dist_release/*
          fail_on_unmatched_files: false

  # ── Consolidate Checksums & Update Release Notes ────────────────────────────
  update-release-notes:
    name: Update Release Notes
    needs: [build-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref }}

      - name: Resolve Release Tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download all checksum artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: checksums-*
          path: all_checksums
          merge-multiple: true

      - name: Consolidate SHA-256 Checksums (including local uploads like macOS DMG)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release_assets
          # Download any assets already on the release (e.g. locally built macOS DMG)
          gh release download "${{ steps.version.outputs.TAG }}" --dir release_assets || true

          mkdir -p release_out
          python3 -c "
          import hashlib, os
          existing_hashes = {}

          # Read GitHub Action built checksums (Linux, Windows)
          if os.path.exists('all_checksums'):
              for root, _, files in os.walk('all_checksums'):
                  for f in files:
                      for line in open(os.path.join(root, f)):
                          parts = line.strip().split()
                          if len(parts) >= 2 and len(parts[0]) == 64:
                              existing_hashes[os.path.basename(parts[1])] = parts[0]

          # Read any assets already on GitHub Release (e.g. locally built macOS DMG)
          if os.path.exists('release_assets'):
              for fname in os.listdir('release_assets'):
                  fpath = os.path.join('release_assets', fname)
                  if os.path.isfile(fpath) and fname not in existing_hashes and fname != 'SHA256SUMS.txt':
                      with open(fpath, 'rb') as f:
                          existing_hashes[fname] = hashlib.sha256(f.read()).hexdigest()

          with open('release_out/SHA256SUMS.txt', 'w') as out:
              for fname in sorted(existing_hashes.keys()):
                  out.write(f'{existing_hashes[fname]}  {fname}\n')
                  print(f'{existing_hashes[fname]}  {fname}')
          "
          cat release_out/SHA256SUMS.txt

      - name: Generate CHConfig-style Release Notes
        run: |
          python3 scripts/generate_release_notes.py \
            --tag "${{ steps.version.outputs.TAG }}" \
            --repo "${{ github.repository }}" \
            --checksums release_out/SHA256SUMS.txt \
            --changelog CHANGELOG.md \
            --output release_out/release_notes.md
          echo "Generated Release Notes:"
          cat release_out/release_notes.md

      - name: Publish Checksum Manifest & Update Release Notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          files: release_out/SHA256SUMS.txt
          body_path: release_out/release_notes.md

      - name: Add Job Summary
        run: |
          echo "# ✅ Cleo Release ${{ steps.version.outputs.TAG }} Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat release_out/release_notes.md >> $GITHUB_STEP_SUMMARY

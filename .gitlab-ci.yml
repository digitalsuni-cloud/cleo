stages:
  - build

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  GIT_DEPTH: 1

# ── 1. Linux x86_64 Desktop Build (AppImage & DEB) ───────────────────────────
build-linux:
  stage: build
  image: ubuntu:22.04
  tags:
    - saas-linux-small-amd64
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends
        curl wget file build-essential libssl-dev patchelf
        libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
        python3 python3-pip python3-venv ca-certificates
    # Install Node.js 20
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    # Install Rust
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
    - source "$HOME/.cargo/env"
  script:
    - TAG="${CI_COMMIT_TAG:-v2.0.0}"
    - VERSION="${TAG#v}"
    - echo "=== Building Cleo Linux Desktop ($VERSION) ==="
    # 1. Build Python standalone backend sidecar
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt pyinstaller
    - bash build-backend.sh --force
    # 2. Build Tauri AppImage and DEB packages
    - npm install
    - npx @tauri-apps/cli build
    # 3. Stage release artifacts
    - mkdir -p dist_release
    - find src-tauri/target/release/bundle/appimage -type f -name "*.AppImage" -exec cp -f {} "dist_release/Cleo_${VERSION}_amd64.AppImage" \;
    - find src-tauri/target/release/bundle/deb -type f -name "*.deb" -exec cp -f {} "dist_release/Cleo_${VERSION}_amd64.deb" \;
    - ls -lh dist_release/
    # 4. Upload artifacts to Generic Package Registry and attach links to Release
    - |
      for f in dist_release/*; do
        fname=$(basename "$f")
        echo "Uploading $fname to Package Registry..."
        curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" \
             --upload-file "$f" \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/release-assets/${TAG}/${fname}"
        echo "Linking $fname to Release ${TAG}..."
        curl --request POST \
             --header "JOB-TOKEN: $CI_JOB_TOKEN" \
             --data name="${fname}" \
             --data url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/release-assets/${TAG}/${fname}" \
             --data direct_asset_path="/downloads/${fname}" \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${TAG}/assets/links" || true
      done
  artifacts:
    name: "cleo-linux-$CI_COMMIT_REF_SLUG"
    paths:
      - dist_release/*
    expire_in: 7 days

# ── 2. Windows x86_64 Desktop Build (Portable .exe) ───────────────────────────
build-windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  script:
    - |
      $TAG = if ($env:CI_COMMIT_TAG) { $env:CI_COMMIT_TAG } else { "v2.0.0" }
      $VERSION = $TAG -replace "^v",""
      Write-Host "=== Building Cleo Windows Desktop ($VERSION) ==="

      # 1. Ensure Rust toolchain is available
      if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
        Write-Host "Installing Rust toolchain..."
        Invoke-WebRequest -Uri https://win.rustup.rs -OutFile rustup-init.exe
        .\rustup-init.exe -y --default-toolchain stable --profile minimal
        $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
      }

      # 2. Ensure Node.js is available
      if (-not (Get-Command npm -ErrorAction SilentlyContinue)) {
        Write-Host "Installing Node.js via Chocolatey..."
        choco install nodejs -y
        $env:PATH = "$env:ProgramFiles\nodejs;$env:PATH"
      }

      # 3. Install Python dependencies & PyInstaller
      python -m pip install --upgrade pip
      pip install -r requirements.txt pyinstaller

      # 4. Build Python backend sidecar (Windows x86_64)
      cmd /c build-backend.bat --force

      # 5. Build Tauri portable executable
      npm install
      npx @tauri-apps/cli build --no-bundle

      # 6. Stage release artifact
      New-Item -ItemType Directory -Force -Path dist_release | Out-Null
      $exe = Get-ChildItem -Path src-tauri\target\release -Recurse -Filter "cleo.exe" | Where-Object { $_.FullName -notmatch "deps|build|examples" } | Select-Object -First 1
      if ($exe) {
        Copy-Item $exe.FullName "dist_release\Cleo_${VERSION}_x64.exe"
        Write-Host "Staged: dist_release\Cleo_${VERSION}_x64.exe"
      } else {
        Write-Error "cleo.exe binary was not produced by Tauri build!"
        exit 1
      }

      # 7. Upload to Generic Package Registry and attach link to Release
      Get-ChildItem -Path dist_release | ForEach-Object {
        $fname = $_.Name
        Write-Host "Uploading $fname to Package Registry..."
        $pkgUrl = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/release-assets/$TAG/$fname"
        Invoke-RestMethod -Uri $pkgUrl -Method Put -Headers @{ "JOB-TOKEN" = $env:CI_JOB_TOKEN } -InFile $_.FullName

        Write-Host "Linking $fname to Release $TAG..."
        $linkUrl = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/releases/$TAG/assets/links"
        $body = @{
          name = $fname
          url = $pkgUrl
          direct_asset_path = "/downloads/$fname"
        }
        try {
          Invoke-RestMethod -Uri $linkUrl -Method Post -Headers @{ "JOB-TOKEN" = $env:CI_JOB_TOKEN } -Body $body
        } catch {
          Write-Host "Link creation note: $_"
        }
      }
  artifacts:
    name: "cleo-windows-$CI_COMMIT_REF_SLUG"
    paths:
      - dist_release/*
    expire_in: 7 days

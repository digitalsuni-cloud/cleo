<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cleo — Cloud FinOps Copilot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .container {
      text-align: center;
      max-width: 420px;
      padding: 32px;
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
    }
    .logo {
      width: 72px;
      height: 72px;
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 8px 22px rgba(56, 189, 248, 0.35));
      animation: pulse 2s infinite ease-in-out;
    }
    .logo svg {
      width: 72px;
      height: 72px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .spinner {
      margin: 24px auto 0;
      width: 24px;
      height: 24px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg class="cleo-logo-svg" width="72" height="72" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="cleoGradTop" x1="24" y1="4" x2="24" y2="24" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#0284c7" />
          </linearGradient>
          <linearGradient id="cleoGradLeft" x1="6" y1="14" x2="24" y2="44" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#818cf8" />
            <stop offset="100%" stop-color="#4f46e5" />
          </linearGradient>
          <linearGradient id="cleoGradRight" x1="42" y1="14" x2="24" y2="44" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#34d399" />
            <stop offset="100%" stop-color="#059669" />
          </linearGradient>
        </defs>
        <polygon points="24,4 42,14 24,24 6,14" fill="url(#cleoGradTop)" opacity="0.95" />
        <polygon points="6,14 24,24 24,44 6,34" fill="url(#cleoGradLeft)" opacity="0.95" />
        <!-- AI Nexus Core -->
        <circle cx="24" cy="24" r="5.2" fill="#090d16" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.6" />
        <path d="M24 20 C24 22.2 22.2 24 20 24 C22.2 24 24 25.8 24 28 C24 25.8 25.8 24 28 24 C25.8 24 24 22.2 24 20 Z" fill="#ffffff" />
        <circle cx="24" cy="24" r="1" fill="#38bdf8" />
      </svg>
    </div>
    <h1>Launching Cleo</h1>
    <p id="status-text">Starting background FinOps engine...</p>
    <div class="spinner"></div>
  </div>

  <!-- The native launcher starts the backend, waits for /health and loads the dashboard,
       and writes progress/errors into #status-text. No cross-origin requests from this page. -->
</body>
</html>

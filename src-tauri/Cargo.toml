[package]
name = "cleo"
version = "1.0.0"
description = "Cleo — Autonomous Multi-Cloud FinOps Copilot"
authors = ["Cleo Team"]
edition = "2021"

[lib]
name = "cleo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = "2.5.8"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
reqwest = { version = "0.12", features = ["native-tls", "json"] }
